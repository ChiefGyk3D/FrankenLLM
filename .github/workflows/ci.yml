name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/bash-ci.yml@b9db99287236b19f0249f83b54acc5cc41126e42 # v1.25.0
    permissions:
      contents: read
    with:
      paths: "bin/ scripts/ remote/ local/ :(top,glob)*.sh"
      # The repository is not shfmt-formatted yet; keep ShellCheck and tests gating.
      shfmt: false
      test-command: ./tests/test-warmup-payloads.sh && ./tests/test-watchdog.sh
