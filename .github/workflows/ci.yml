name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/bash-ci.yml@a5b834a6e03e0bf7187eeebfa84685498d73b139 # v1.14.0
    permissions:
      contents: read
    with:
      paths: "bin/ scripts/ remote/ local/ :(top,glob)*.sh"
      # The repository is not shfmt-formatted yet; keep ShellCheck and tests gating.
      shfmt: false
      test-command: ./tests/test-warmup-payloads.sh
